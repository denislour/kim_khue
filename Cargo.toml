[package]
name = "kimkhue"
version = "0.1.0"
edition = "2024"
default-run = "kimkhue"

[dependencies]
dotenvy = "0.15.7"
toasty = { version = "0.11.0", features = ["sqlite"] }
tokio = { version = "1.51.1", features = ["macros", "rt-multi-thread"] }
topcoat = { version = "0.10.0", default-features = false, features = ["asset", "discover", "router", "serve", "view", "tailwind", "ui", "runtime", "icon-iconify"] }

# Speed up compilation while keeping file and line numbers in error backtraces.
[profile.dev]
debug = "line-tables-only"

# Speed up compilation by skipping debug information for dependencies.
[profile.dev.package."*"]
debug = false

[build-dependencies]
topcoat = { version = "0.10.0", default-features = false, features = ["tailwind", "icon-iconify"] }
